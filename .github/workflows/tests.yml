name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Only this step touches the real Postgres service — it validates
      # that migrations (including Postgres-specific DDL like the
      # employment_contracts EXCLUDE constraint) actually apply cleanly.
      # DB_* is scoped here, not at the job level, so it can never leak
      # into the test run below: the Pest suite is designed to run on
      # sqlite (see phpunit.xml and .ai/26-PROGRESS.md) specifically so
      # tests can exercise app-level fallback validation that only
      # matters where the Postgres-only DB constraint doesn't exist.
      - name: Setup Application
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: laravel
          DB_PASSWORD: laravel
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
